[package]
name = "texembed"
version = "0.1.1"
edition = "2021"
description = "Texture viewer, extractor and replacer for Split/Second (PC) .textures and .streamtex files"
license = "MIT"
repository = "https://github.com/theUssa1n/TEXembed"
readme = "README.md"

[build-dependencies]
winres = "0.1"

[dependencies]
anyhow = { version = "1.0.69", features = ["backtrace"] }
byteorder = "1.4.3"
rfd = "0.14.0"
eframe = "0.29.0"
egui = "0.29.0"
image = { version = "0.25.0", features = ["dds"] }
image_dds = "0.7.2"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "unwind"
incremental = false
strip = true
overflow-checks = true
debug = false
debug-assertions = false
